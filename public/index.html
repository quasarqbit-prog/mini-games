<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leisure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%2314110e'/%3E%3Crect x='8' y='8' width='22' height='22' rx='4' fill='%233f8f5b'/%3E%3Crect x='34' y='8' width='22' height='22' rx='4' fill='%23c48a2a'/%3E%3Crect x='8' y='34' width='22' height='22' rx='4' fill='%233a332c'/%3E%3Crect x='34' y='34' width='22' height='22' rx='4' fill='%23ff6b4a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shell.css">
  <link rel="stylesheet" href="/lobby.css">
</head>
<body>
  <div id="bg-fx" aria-hidden="true">
    <div class="bg-wash"></div>
    <div class="bg-mass">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <canvas id="bg-net"></canvas>
  </div>
  <div id="toasts"></div>
  <div id="hub-notes"></div>
  <header class="top">
    <div id="header-slot"></div>
  </header>
  <div id="account-panel" hidden></div>
  <main id="view"></main>
  <div id="modal" hidden></div>
  <div class="pixel-modal" id="onboard" hidden>
    <div class="gate">
      <form class="gate-card onboard-form" id="onboard-form">
        <button type="button" class="planet-lang" id="onboard-lang">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
            <ellipse cx="8" cy="8" rx="3" ry="6" fill="none" stroke="currentColor" stroke-width="1.5"></ellipse>
            <path d="M2 8h12M3.2 5.2h9.6M3.2 10.8h9.6" fill="none" stroke="currentColor" stroke-width="1.5"></path>
          </svg>
          <span id="onboard-lang-code">ru</span>
        </button>
        <div class="onboard-row">
          <label class="avatar-frame">
            <img id="onboard-avatar" alt="" hidden>
            <span id="onboard-letter">?</span>
            <input id="onboard-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          </label>
          <input id="onboard-name" maxlength="20" data-i18n-placeholder="onboard.name" placeholder="Никнейм">
        </div>
        <button class="act" type="submit" data-i18n="gate.create">Создать лобби</button>
      </form>
      <form class="gate-join" id="gate-join">
        <input id="gate-code" maxlength="8" autocomplete="off" data-i18n-placeholder="gate.code" placeholder="Код лобби">
        <button class="act" type="submit" data-i18n="gate.join">Присоединиться</button>
        <ul id="gate-people" class="gate-people" hidden></ul>
      </form>
    </div>
  </div>
  <script src="/backdrop.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shell.js"></script>
  <script src="/monopoly.js"></script>
  <script src="/client.js"></script>
  <script src="/lobby.js"></script>
</body>
</html>
